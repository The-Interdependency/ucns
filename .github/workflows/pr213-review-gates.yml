name: pr213-review-gates

on:
  push:
    branches: [agent/xkcd-lexical-floor]

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    if: contains(github.event.head_commit.message, '[pr213-gates]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UCNS repair head
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Checkout UCNS-pinned skill-lib authority
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: 5d36c0d52c6eabed46cc7665189a9a91ddf2b768
          path: .skill-lib-canon
      - name: Install UCNS verification dependencies
        run: |
          python -m pip install --upgrade pip pytest build twine
          python -m pip install -e ".[test]"
      - name: UCNS vendored skill drift
        run: >-
          python .skill-lib-canon/tools/check_consumer_drift.py .
          --canon-root .skill-lib-canon
          --sha 5d36c0d52c6eabed46cc7665189a9a91ddf2b768
          --strict-sha
          --require-vendored
      - name: UCNS skill-lib contract graph
        run: python tools/verify_skill_lib_contracts.py .
      - name: UCNS tests
        run: python -m pytest
      - name: UCNS package build
        run: python -m build
      - name: UCNS distribution check
        run: python -m twine check dist/*
      - name: Checkout current canonical skill-lib
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: ec33aae61a950daaff4dfc577c546568ad2e558e
          path: .skill-lib-current
      - name: Current skill-lib unit tests
        working-directory: .skill-lib-current
        run: python -m unittest discover -s tests
      - name: Current skill-lib drift
        working-directory: .skill-lib-current
        run: python tools/check_skill_lib_drift.py
      - name: Current skill compliance
        working-directory: .skill-lib-current
        run: python tools/check_skill_compliance.py
      - name: Current Codex plugin adapter drift
        working-directory: .skill-lib-current
        run: python tools/build_codex_plugin_skills.py --check
      - name: Current ratios strict gate
        working-directory: .skill-lib-current
        run: python ratios/ratios_check.py --strict
      - name: Current llms-build drift
        working-directory: .skill-lib-current
        run: python -m llms.build --root . --out llms.txt --check
      - name: Current RepoLOTO audit
        working-directory: .skill-lib-current
        run: python tests/test_repo_loto.py --audit
      - name: Current RepoLOTO checks
        working-directory: .skill-lib-current
        run: python tests/test_repo_loto.py
      - name: Record successful gates on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pr213-gates.md <<EOF
          PR #213 repair gates **SURVIVED** at UCNS commit \`${GITHUB_SHA}\`.

          - UCNS pinned-skill drift + contract graph + full pytest + build + twine: PASS
          - canonical skill-lib \`ec33aae61a950daaff4dfc577c546568ad2e558e\`: unit tests, drift, compliance, plugin adapter, ratios, llms-build, RepoLOTO audit/checks: PASS
          - This is validation only; candidate selection remains false and no merge is authorized.
          EOF
          gh pr comment 213 --body-file /tmp/pr213-gates.md
