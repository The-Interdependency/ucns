name: geometry-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout pinned skill-lib authority
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: 5e7239b52dc5403d8d01fbc63341fe397719ec3f
          path: .skill-lib-canon
          sparse-checkout: |
            msdmd
            meta-module-build
            test-build
            canon
            domain-claims
            gonol-build
            ucns-option-selection
            interdependent-work-graph
            doctrine
            RESOURCE_RUN_INVARIANT.md
            tools/check_consumer_drift.py
            the-interdependency
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Install verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpfr6
          python -m pip install uv==0.11.18
      - name: Check lock and install verification dependencies
        run: |
          uv lock --check
          uv sync --locked --python python --extra test --extra build
      - name: Check vendored skill-lib drift
        run: >-
          python .skill-lib-canon/tools/check_consumer_drift.py .
          --canon-root .skill-lib-canon
          --sha 5e7239b52dc5403d8d01fbc63341fe397719ec3f
          --strict-sha
          --require-vendored
      - name: Audit skill-lib contract graph
        run: .venv/bin/python tools/verify_skill_lib_contracts.py .
      - name: Run geometry tests
        run: .venv/bin/python -m pytest
      - name: Build package
        run: .venv/bin/python -m build
      - name: Check distributions
        run: |
          .venv/bin/python -m twine check dist/*
          .venv/bin/python tools/verify_distributions.py . dist
