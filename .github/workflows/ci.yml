name: carrier-floor-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout pinned skill-lib authority
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: a0cb6285e37734609b4b487ae4a2e44c6108d2b8
          path: .skill-lib-canon
          sparse-checkout: |
            msdmd
            meta-module-build
            test-build
            canon
            domain-claims
            gonal-morphology
            interdependent-work-graph
            doctrine
            RESOURCE_RUN_INVARIANT.md
            tools/check_consumer_drift.py
            the-interdependency
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip pytest build twine
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Check vendored skill-lib drift
        run: >-
          python .skill-lib-canon/tools/check_consumer_drift.py .
          --canon-root .skill-lib-canon
          --sha a0cb6285e37734609b4b487ae4a2e44c6108d2b8
          --strict-sha
          --require-vendored
      - name: Audit skill-lib contract graph
        run: python tools/verify_skill_lib_contracts.py .
      - name: Run tests
        run: python -m pytest
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*

  recursive-full-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install candidate
        run: python -m pip install -e ".[test]"
      - name: Checkout frozen OEWN 2025 Core
        uses: actions/checkout@v7.0.1
        with:
          repository: globalwordnet/english-wordnet
          ref: dc343f2683279ecbb13fab4e2fd778d7b162d287
          fetch-depth: 0
          path: .oewn-2025-core
      - name: Preflight resources
        run: |
          free -h
          df -h .
      - name: Rebuild and independently replay complete recursive candidate
        env:
          UCNS_OEWN_2025_CORE_ROOT: ${{ github.workspace }}/.oewn-2025-core
        run: |
          python - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path

          from ucns.lexical_sources import verify_oewn_2025_core
          from ucns.oewn_core import load_oewn_core
          from ucns.oewn_definition_recursion import build_oewn_definition_layer
          from ucns.recursive_gonol_relations import (
              RECURSIVE_GONOL_STANDING,
              build_source_native_recursive_gonols,
              recursive_gonol_layer_bytes,
              replay_source_native_recursive_gonols,
          )

          root = Path(os.environ["UCNS_OEWN_2025_CORE_ROOT"])
          receipt = verify_oewn_2025_core(root)
          snapshot = load_oewn_core(root, receipt)
          layer = build_oewn_definition_layer(snapshot)
          expected_definition = "ucns.oewn-definition-layer:sha256:0242af7a53d0e6a9b1095136e1dd139a4822700c8b6700ee104e229dcb646b2b"
          if layer.layer_id != expected_definition:
              raise SystemExit(f"definition-layer identity rotated: {layer.layer_id}")

          recursive = build_source_native_recursive_gonols(snapshot, layer)
          replayed = replay_source_native_recursive_gonols(recursive, snapshot, layer)
          payload = recursive_gonol_layer_bytes(recursive)
          if recursive_gonol_layer_bytes(replayed) != payload:
              raise SystemExit("independent recursive replay differs byte-for-byte")
          if recursive.selected or recursive.standing != RECURSIVE_GONOL_STANDING:
              raise SystemExit("candidate promotion boundary violated")
          if len(recursive.gonols) != 244727:
              raise SystemExit(f"recursive scope changed: {len(recursive.gonols)}")
          parsed = json.loads(payload)
          expected_gonol_digest = "ad46b9f59f9c33b3e95f2ba0a324d85ac5db6557dec078fec52e92569464f6cd"
          if parsed["recursive_gonol_ids_sha256"] != expected_gonol_digest:
              raise SystemExit("recursive gonol identities changed; construction semantics drifted")

          print("FULL_REPLAY_SURVIVED")
          print(f"definition_layer_id={layer.layer_id}")
          print(f"recursive_layer_id={recursive.layer_id}")
          print(f"recursive_count={len(recursive.gonols)}")
          print(f"producer_code_reference={recursive.producer_code_reference}")
          print(f"recursive_gonol_ids_sha256={parsed['recursive_gonol_ids_sha256']}")
          print(f"receipt_sha256={sha256(payload).hexdigest()}")
          print("receipt_json=" + payload.decode("utf-8").strip())
          print(f"selected={recursive.selected}")
          PY
      - name: Historical receipts remain untouched
        run: |
          git diff --exit-code -- \
            generated/oewn-2025-core-definition-layer-receipt.json \
            generated/oewn-2025-core-punctuation-aware-definition-layer-receipt.json \
            generated/oewn-2025-core-source-native-recursive-gonol-receipt.json
